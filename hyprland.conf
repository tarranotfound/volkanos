systemctl --user enable --now mpd




blur {
    enabled = true
    size = 4
    passes = 2
    new_optimizations = true
}
# =========================
# PALETTE
# =========================
$cream = 0xfffff1c4
$sage = 0xff9cbd82
$periwinkle = 0xff556fe6
$red = 0xffe0283b
# =========================
# GENERAL
# =========================
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $periwinkle
    col.inactive_border = 0x66fff1c4
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true   # TAMBAHAN: mastiin cursor berubah jadi ikon resize saat hover border/corner
}
# =========================
# DECORATION
# =========================
decoration {
    active_opacity = 1.0
    inactive_opacity = 0.95
}
# =========================
# DWINDLE
# =========================
dwindle {
    pseudotile = true
    preserve_split = true
}
# =========================
# WINDOW RULES  <-- BAGIAN BARU, INI KUNCI UTAMA FIX-NYA
# =========================
# Semua window baru buka FLOATING (bukan auto-tiling/fullscreen),
# persis kayak window app biasa di Windows. Karena floating, border-nya
# independen, jadi resize_on_border di atas sekarang benar-benar punya
# sesuatu buat digrab & ditarik.
windowrulev2 = float, class:^(.*)$
windowrulev2 = center, class:^(.*)$
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, M, togglespecialworkspace, minimize
bindm = SUPER, mouse:272, movewindow
# Kalau ada app tertentu yang tetap kamu mau default tiling (dwindle),
# kecualikan manual di sini, contoh:
# windowrulev2 = tile, class:^(kitty)$
# =========================
# INPUT
# =========================
input {
    follow_mouse = 1
}
# =========================
# MAIN MOD
# =========================
$mainMod = SUPER
bind = $mainMod, T, exec, ~/.local/bin/wallpaper-menu
# =========================
# APPLICATIONS
# =========================
bind = $mainMod, Return, exec, kitty
# =========================
# WINDOW MANAGEMENT
# =========================
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
# =========================
# FOCUS
# =========================
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# =========================
# MOVE WINDOW
# =========================
# CATATAN: karena window sekarang floating by default, dispatcher
# movewindow di sini bukan lagi "swap posisi tiling", tapi mendorong
# window ke tepi layar ke arah tsb (mirip Windows Snap). Tetap berguna,
# cuma perilakunya beda dari sebelumnya saat masih tiling.
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
# =========================
# RESIZE WINDOW
# =========================
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40
# =========================
# MOUSE
# =========================
# Super + left click = move window (tetap berguna buat app tanpa titlebar)
bindm = $mainMod, mouse:272, movewindow
# Super + right click = resize window (dipertahankan sebagai alternatif,
# TAPI cara utama sekarang: klik langsung di border/corner window, tarik,
# tanpa modifier apa pun — aktif dari resize_on_border + windowrulev2 float di atas)
bindm = $mainMod, mouse:273, resizewindow
# =========================
# WORKSPACES
# =========================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
# =========================
# BRIGHTNESS
# =========================
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
# =========================
# GESTURES
# =========================
gesture = 4, horizontal, workspace
# =========================


layerrule = animation slide, waybar
layerrule = ignorezero, waybar


plugin {
    hyprbars {
        bar_height     = 28
        bar_color      = rgb(46588f)
        bar_text_size  = 11
        bar_text_font  = JetBrainsMono Nerd Font
        col.text       = rgb(ffeabf)

        # tombol (urutan kanan ke kiri)
        hyprbars-button = rgb(b4637a), 14, X, hyprctl dispatch killactive
        hyprbars-button = rgb(3b6cff), 14, □, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(6f9b6f), 14, −, hyprctl dispatch movetoworkspacesilent special:minimized
    }
}

# keybind buat munculin lagi window yang di-"minimize"
bind = SUPER, M, togglespecialworkspace, minimized


