# Add this to ~/.config/hypr/hyprland.conf (or `source` it as a separate file)

# Only the trigger strip autostarts — the main bar stays hidden until clicked
exec-once = waybar -c ~/.config/waybar/trigger.jsonc -s ~/.config/waybar/trigger.css

# Make the toggle script executable once, from a terminal:
#   chmod +x ~/.config/waybar/toggle.sh

# Slide animation for the main bar when it spawns/closes from the top edge
layerrule = animation slide, waybar
layerrule = blur, waybar
layerrule = ignorezero, waybar

# Optional: dedicated animation curve/speed just for layers (feels snappier)
bezier = waybarSlide, 0.16, 1, 0.3, 1
animation = layers, 1, 4, waybarSlide, slide
